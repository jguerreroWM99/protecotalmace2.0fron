<div class="recover-container">
  <mat-card class="recover-card">
    <mat-card-header class="recover-header">
      <div class="logo-circle">
        <mat-icon>lock_reset</mat-icon>
      </div>
      <mat-card-title>Recuperar Contraseña</mat-card-title>
      <mat-card-subtitle>Verifica tu identidad ingresando tus 4 datos registrados</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="recuperarForm" (ngSubmit)="restablecer()" class="recover-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="username" placeholder="Ej. jose123" />
          <mat-icon matPrefix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>DNI o Carné de Extranjería</mat-label>
          <input matInput formControlName="documentoIdentidad" placeholder="Ej. 33333333" />
          <mat-icon matPrefix>badge</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Fecha de Nacimiento</mat-label>
          <input matInput type="date" formControlName="fechaNacimiento" />
          <mat-icon matPrefix>cake</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo Electrónico</mat-label>
          <input matInput type="email" formControlName="correo" placeholder="Ej. jose@jose.com" />
          <mat-icon matPrefix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nueva Contraseña</mat-label>
          <input
            matInput
            [type]="ocultarPassword ? 'password' : 'text'"
            formControlName="nuevaPassword"
          />
          <mat-icon matPrefix>vpn_key</mat-icon>
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="ocultarPassword = !ocultarPassword"
          >
            <mat-icon>{{ ocultarPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="btn-submit"
          [disabled]="cargando"
        >
          {{ cargando ? 'Validando datos...' : 'Restablecer Contraseña' }}
        </button>

        <div class="back-link">
          <a routerLink="/login">Volver al inicio de sesión</a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
